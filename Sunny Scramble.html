<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunny Scramble</title>
<style>
:root{--bg:#fff1cf;--fg:#2a2150;--chip:#ffffffd9;--pink:#ff4f8b;--sun:#ffc928;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171433;--fg:#fff3d6;--chip:#2b2556d9}}
:root[data-theme="dark"]{--bg:#171433;--fg:#fff3d6;--chip:#2b2556d9}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;overscroll-behavior:none;touch-action:none}
#app{width:min(96vw,560px);display:flex;flex-direction:column;gap:8px;padding:8px 0}
#hud{display:flex;gap:6px;align-items:stretch}
.chip{flex:1;background:var(--chip);border-radius:14px;padding:4px 10px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.chip small{font-size:11px;opacity:.7;font-weight:700}
.chip b{font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
#lives{letter-spacing:1px}
.btn{border:0;border-radius:14px;background:var(--chip);color:var(--fg);font-size:20px;width:46px;cursor:pointer}
.btn:focus-visible,.go:focus-visible,.pad button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
#wrap{position:relative;width:min(100%,calc(100dvh - 130px));align-self:center;aspect-ratio:1;border-radius:20px;overflow:hidden;box-shadow:0 8px 30px #2a21503d}
canvas{width:100%;height:100%;display:block;background:#1d1745}
#ov{position:absolute;inset:0;background:#150f3ccc;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff6dd;padding:16px}
#ov.hide{display:none}
#ov h1{font-size:clamp(28px,8vw,44px);margin:0 0 6px;color:var(--sun);text-shadow:0 3px 0 #e0457a}
#ov p{margin:6px auto 14px;max-width:30ch;line-height:1.4;font-size:15px}
.go{border:0;border-radius:999px;background:var(--pink);color:#fff;font:700 18px inherit;font-family:inherit;padding:12px 30px;cursor:pointer;box-shadow:0 4px 0 #b02b5c}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #b02b5c}
.pad{display:none;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,64px);gap:6px;justify-content:center}
.pad button{border:0;border-radius:18px;background:var(--chip);color:var(--fg);font-size:26px;touch-action:none}
.pad button:active{background:var(--sun)}
@media (pointer:coarse),(max-width:700px){.pad{display:grid}#wrap{width:min(100%,calc(100dvh - 320px))}}
@media (prefers-reduced-motion:reduce){.go{transition:none}}
</style></head><body>
<div id="app">
 <div id="hud">
  <div class="chip"><small>Score</small><b id="sc">0</b></div>
  <div class="chip"><small>Level</small><b id="lv">1</b></div>
  <div class="chip"><small>Lives</small><b id="li">❤❤❤</b></div>
  <button class="btn" id="mute" aria-label="Toggle sound">🔊</button>
  <button class="btn" id="pause" aria-label="Pause">⏸</button>
 </div>
 <div id="wrap"><canvas id="cv"></canvas>
  <div id="ov"><div><h1 id="ot">Sunny Scramble</h1><p id="ob">Gobble every dot, dodge the gremlins, and grab a star to tag them back. Arrow keys, WASD, swipe or the pad.</p><button class="go" id="ogo">Play</button></div></div>
 </div>
 <div class="pad" id="pad">
  <span></span><button data-d="u" aria-label="Up">▲</button><span></span>
  <button data-d="l" aria-label="Left">◀</button><span></span><button data-d="r" aria-label="Right">▶</button>
  <span></span><button data-d="d" aria-label="Down">▼</button><span></span>
 </div>
</div>
<script>
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');
const W=17,H=17,TS=24;
const RAW=["#################","#o......#......o#","#.##.##.#.##.##.#","#...............#","#.##.#.###.#.##.#","#....#.....#....#","####.###-###.####","####.#HHHHH#.####","####.#######.####","#...............#","#.##.#.###.#.##.#","#o...#.....#...o#","##.#.##.#.##.#.##","#.....#...#.....#","#.##.##.#.##.##.#","#...............#","#################"];
const D={u:{x:0,y:-1},d:{x:0,y:1},l:{x:-1,y:0},r:{x:1,y:0}},OPP={u:'d',d:'u',l:'r',r:'l'};
const GC=['#ff6b6b','#b86bff','#2ec4b6','#ff9f1c'],CORN=[[15,1],[1,1],[15,15],[1,15]];
const FRUIT=['🍒','🍓','🍊','🍎','🍇','🍉'];
const HUES=[265,200,330,150,30];
let grid,S={state:'menu',score:0,lives:3,level:1,t:0,best:0},P,G=[],parts=[],pops=[],walls,wallsF;
try{S.best=+localStorage.getItem('sunnyBest')||0}catch(e){}
let want=null,AC=null,muted=false,altDot=0;

/* ---------- audio ---------- */
function tone(f,d=.08,type='square',v=.05,slide=0,delay=0){
 if(muted||!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}
const SFX={
 dot(){altDot^=1;tone(altDot?520:680,.05,'triangle',.07)},
 power(){[392,523,659,784].forEach((f,i)=>tone(f,.1,'square',.05,0,i*.06))},
 ghost(){tone(300,.25,'sawtooth',.06,700)},
 fruit(){[880,1175,1568].forEach((f,i)=>tone(f,.09,'triangle',.08,0,i*.06))},
 die(){tone(600,.7,'sawtooth',.07,-520)},
 win(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.13,'triangle',.08,0,i*.1))},
 start(){[392,523,659].forEach((f,i)=>tone(f,.1,'triangle',.07,0,i*.09))},
 over(){[330,262,196,131].forEach((f,i)=>tone(f,.25,'triangle',.08,0,i*.22))}};
function initAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}

/* ---------- setup ---------- */
function mkWalls(hue,flash){
 const c=document.createElement('canvas');c.width=W*TS*2;c.height=H*TS*2;const x=c.getContext('2d');x.scale(2,2);
 const isW=(a,b)=>b>=0&&b<H&&a>=0&&a<W&&RAW[b][a]==='#';
 for(const [ins,col] of [[1,flash?'#fff':`hsl(${hue},90%,68%)`],[3.5,flash?'#ffe27a':`hsl(${hue},55%,26%)`]]){
  x.fillStyle=col;
  for(let j=0;j<H;j++)for(let i=0;i<W;i++){
   if(!isW(i,j))continue;const px=i*TS,py=j*TS;
   x.beginPath();x.roundRect(px+ins,py+ins,TS-2*ins,TS-2*ins,6);x.fill();
   if(isW(i+1,j))x.fillRect(px+TS-ins-2,py+ins,2*ins+4,TS-2*ins);
   if(isW(i,j+1))x.fillRect(px+ins,py+TS-ins-2,TS-2*ins,2*ins+4);
  }}
 x.fillStyle='#ff8fc0';x.fillRect(8*TS+2,6*TS+9,TS-4,5);
 return c}
function loadLevel(){
 grid=RAW.map(r=>r.split(''));grid[15][8]=' ';
 S.dots=0;grid.forEach(r=>r.forEach(c=>{if(c==='.'||c==='o')S.dots++}));S.total=S.dots;S.eaten=0;
 const h=HUES[(S.level-1)%HUES.length];walls=mkWalls(h,false);wallsF=mkWalls(h,true);
 const L=S.level;S.gs=Math.min(4.8+.35*(L-1),6.2);S.ft=Math.max(2.5,7-.9*(L-1));S.ng=L===1?3:4;
 S.fruit=null;S.fruitDone=[0,0];resetPos();ready('Level '+L)}
function resetPos(){
 P={x:8,y:15,dir:'l',moving:false,sp:6.2};want=null;S.power=0;S.scat=false;S.cyc=0;S.combo=0;
 G=[];for(let i=0;i<S.ng;i++){const out=i===0;
  G.push({i,x:out?8:[7,9,6][i-1],y:out?5:7,dir:out?'l':'u',mode:out?'normal':'house',fr:0,rel:out?0:2.5*i/(1+.08*S.level),col:GC[i],moving:true})}}
function ready(txt){S.state='ready';S.timer=1.8;S.banner=txt;SFX.start()}
function newGame(){initAudio();S.score=0;S.lives=3;S.level=1;S.nextLife=5000;parts=[];pops=[];hide();loadLevel();hud()}
function hud(){$('sc').textContent=S.score;$('lv').textContent=S.level;$('li').textContent='❤'.repeat(Math.max(0,S.lives))||'–'}
function addScore(n){S.score+=n;if(S.score>=S.nextLife){S.lives++;S.nextLife+=10000;pop(P.x,P.y-1,'1UP ❤','#ff8fc0')}hud()}

/* ---------- movement ---------- */
const tileAt=(x,y)=>(y<0||y>=H||x<0||x>=W)?'#':grid[y][x];
const pOK=(x,y)=>{const c=tileAt(x,y);return c!=='#'&&c!=='H'&&c!=='-'};
const gOK=(x,y,g)=>{const c=tileAt(x,y);if(c==='#')return false;if(c==='H'||c==='-')return g.mode==='eaten'||g.mode==='exit';return true};
function advance(e,dist,decide){
 while(dist>1e-9){
  const cx=Math.round(e.x),cy=Math.round(e.y);let nd;
  if(Math.abs(e.x-cx)<1e-6&&Math.abs(e.y-cy)<1e-6){e.x=cx;e.y=cy;if(!decide(e,cx,cy)){e.moving=false;return}nd=1}
  else{const v=D[e.dir];nd=v.x>0?Math.ceil(e.x)-e.x:v.x<0?e.x-Math.floor(e.x):v.y>0?Math.ceil(e.y)-e.y:e.y-Math.floor(e.y)}
  e.moving=true;const v=D[e.dir],s=Math.min(dist,nd);e.x+=v.x*s;e.y+=v.y*s;dist-=s;
  if(Math.abs(e.x-Math.round(e.x))<1e-6)e.x=Math.round(e.x);if(Math.abs(e.y-Math.round(e.y))<1e-6)e.y=Math.round(e.y)}}
function pDecide(e,cx,cy){
 eatAt(cx,cy);
 if(want&&pOK(cx+D[want].x,cy+D[want].y))e.dir=want;
 return pOK(cx+D[e.dir].x,cy+D[e.dir].y)}
function gDecide(g,cx,cy){
 if(g.mode==='eaten'&&cx===8&&cy===7){g.mode='exit';g.fr=0}
 if(g.mode==='exit'&&cy<=5)g.mode='normal';
 let o=[];for(const k of 'udlr'){if(k===OPP[g.dir])continue;if(gOK(cx+D[k].x,cy+D[k].y,g))o.push(k)}
 if(!o.length){if(gOK(cx+D[OPP[g.dir]].x,cy+D[OPP[g.dir]].y,g))o=[OPP[g.dir]];else return false}
 if(g.fr>0&&g.mode==='normal'||g.mode==='normal'&&g.i===3&&Math.random()<.35){g.dir=o[Math.floor(Math.random()*o.length)];return true}
 let t;
 if(g.mode==='eaten')t=[8,7];else if(g.mode==='exit')t=[8,5];
 else if(S.scat)t=CORN[g.i];
 else if(g.i===1)t=[P.x+D[P.dir].x*4,P.y+D[P.dir].y*4];
 else if(g.i===2&&Math.hypot(P.x-cx,P.y-cy)<6)t=CORN[2];
 else t=[P.x,P.y];
 let best=1e9;for(const k of o){const d=(cx+D[k].x-t[0])**2+(cy+D[k].y-t[1])**2;if(d<best){best=d;g.dir=k}}
 return true}

/* ---------- events ---------- */
function burst(x,y,col,n=6,sp=40,life=.5){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=sp*(.4+Math.random());parts.push({x:x*TS+12,y:y*TS+12,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:life,m:life,c:col,r:2+Math.random()*2})}}
function pop(x,y,t,c='#fff'){pops.push({x:x*TS+12,y:y*TS+12,t,c,l:1})}
function eatAt(cx,cy){
 const c=grid[cy][cx];
 if(c==='.'||c==='o'){grid[cy][cx]=' ';S.dots--;S.eaten++;
  if(c==='.'){addScore(10);SFX.dot();burst(cx,cy,'#fff0a0',3,30,.3)}
  else{addScore(50);SFX.power();S.combo=0;S.power=S.ft;burst(cx,cy,'#7fd6ff',16,90,.7);parts.push({ring:1,x:cx*TS+12,y:cy*TS+12,l:.6,m:.6,c:'#7fd6ff',r:0});
   G.forEach(g=>{if(g.mode==='normal'){g.fr=S.ft;g.dir=OPP[g.dir]}});pop(cx,cy-1,'TAG TIME!','#7fd6ff')}
  [.25,.6].forEach((f,i)=>{if(!S.fruitDone[i]&&S.eaten>=S.total*f){S.fruitDone[i]=1;S.fruit={t:9}}});
  if(S.dots<=0){S.state='clear';S.timer=2.4;SFX.win();for(let i=0;i<60;i++)burst(Math.random()*W,Math.random()*H,['#ff6b6b','#ffc928','#2ec4b6','#b86bff'][i%4],2,70,1.2)}}}
function die(){S.state='dying';S.timer=1.4;SFX.die();S.shake=.3;burst(P.x,P.y,'#ffc928',14,80,.8)}
function collide(){
 for(const g of G){if(g.mode==='eaten'||g.mode==='house')continue;
  if(Math.hypot(g.x-P.x,g.y-P.y)<.65){
   if(g.fr>0&&g.mode==='normal'){g.mode='eaten';g.fr=0;const p=200*2**S.combo++;addScore(p);SFX.ghost();pop(g.x,g.y-.6,p,'#7fd6ff');burst(g.x,g.y,g.col,10,80,.5);S.freeze=.22}
   else{die();return}}}
 if(S.fruit&&Math.hypot(8-P.x,9-P.y)<.6){const p=[100,300,500,700,1000,2000][Math.min(S.level-1,5)];addScore(p);SFX.fruit();pop(8,8.4,p,'#ffd75a');burst(8,9,'#ff8fc0',10,70,.6);S.fruit=null}}

/* ---------- update ---------- */
function update(dt){
 S.t+=dt;if(S.shake>0)S.shake-=dt;
 parts.forEach(p=>{p.l-=dt;if(!p.ring){p.x+=p.vx*dt;p.y+=p.vy*dt}});parts=parts.filter(p=>p.l>0);
 pops.forEach(p=>{p.l-=dt;p.y-=18*dt});pops=pops.filter(p=>p.l>0);
 if(S.state==='ready'){S.timer-=dt;if(S.timer<=0)S.state='play';return}
 if(S.state==='clear'){S.timer-=dt;if(S.timer<=0){S.level++;hud();loadLevel()}return}
 if(S.state==='dying'){S.timer-=dt;if(S.timer<=0){S.lives--;hud();if(S.lives<=0)gameOver();else{resetPos();ready('Oops! Go!')}}return}
 if(S.state!=='play')return;
 if(S.freeze>0){S.freeze-=dt;return}
 S.cyc+=dt;const sl=Math.max(2,6-S.level);if(S.cyc>18+sl){S.cyc=0}S.scat=S.cyc>18;
 if(want&&want===OPP[P.dir]){const cx=Math.round(P.x),cy=Math.round(P.y);if(Math.abs(P.x-cx)>1e-6||Math.abs(P.y-cy)>1e-6)P.dir=want}
 advance(P,P.sp*dt,pDecide);
 if(S.power>0)S.power-=dt;
 for(const g of G){
  if(g.mode==='house'){g.rel-=dt;if(g.rel<=0){g.mode='exit';g.dir='r'}continue}
  if(g.fr>0)g.fr-=dt;
  const sp=g.mode==='eaten'?11:g.mode==='exit'?4:g.fr>0?3.3:S.gs*(g.i===0?1.04:1);
  advance(g,sp*dt,gDecide)}
 if(S.fruit){S.fruit.t-=dt;if(S.fruit.t<=0)S.fruit=null}
 if(S.state==='play')collide()}
function gameOver(){S.state='over';SFX.over();if(S.score>S.best){S.best=S.score;try{localStorage.setItem('sunnyBest',S.best)}catch(e){}}
 show('Game Over',`You scored ${S.score} and reached level ${S.level}. Best: ${S.best}.`,'Play again')}

/* ---------- drawing ---------- */
const fc=(x,y,r,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill()};
function drawHero(){
 let px=P.x*TS+12,py=P.y*TS+12,sc=1,rot=0,jump=0;const v=D[P.dir];
 if(S.state==='dying'){const k=1-S.timer/1.4;sc=Math.max(0,1-k);rot=k*12}
 if(S.state==='clear')jump=-Math.abs(Math.sin(S.t*9))*5;
 ctx.save();ctx.translate(px,py+jump);ctx.rotate(rot);ctx.scale(sc,sc);
 if(S.power>0){const a=.25+.15*Math.sin(S.t*12);fc(0,0,15,`rgba(127,214,255,${a})`)}
 const sq=P.moving?Math.sin(S.t*20)*.06:0;ctx.scale(1+sq,1-sq);
 fc(-4,9.5,3,'#e88a1a');fc(4,9.5,3,'#e88a1a');
 const gr=ctx.createRadialGradient(-3,-4,2,0,0,11);gr.addColorStop(0,'#ffe36e');gr.addColorStop(1,'#ffb020');fc(0,0,10.5,gr);
 ctx.fillStyle='#4fc16a';ctx.beginPath();ctx.ellipse(2,-11,2.2,4,.6,0,6.3);ctx.fill();
 fc(-6,2.5,2,'#ff8a8a88');fc(6,2.5,2,'#ff8a8a88');
 fc(-3.5+v.x*1.6,-2+v.y*1.4,2.3,'#fff');fc(3.5+v.x*1.6,-2+v.y*1.4,2.3,'#fff');
 fc(-3.5+v.x*2.4,-2+v.y*2,1.2,'#2a2150');fc(3.5+v.x*2.4,-2+v.y*2,1.2,'#2a2150');
 const o=P.moving?(Math.sin(S.t*16)+1)/2:.2;ctx.fillStyle='#8a2a2a';ctx.beginPath();ctx.ellipse(v.x*1.2,4.2+v.y*1,3.2,1+2.2*o,0,0,6.3);ctx.fill();
 ctx.restore()}
function drawGhost(g){
 const px=g.x*TS+12,py=g.y*TS+12+(g.mode==='house'?Math.sin(S.t*6+g.i*2)*2:0);
 const fr=g.fr>0&&g.mode==='normal',ea=g.mode==='eaten',v=D[g.dir];
 ctx.save();ctx.translate(px,py);
 if(!ea){const fl=fr&&g.fr<2&&Math.floor(S.t*8)%2,col=fr?(fl?'#fff':'#5aa9ff'):g.col,w=Math.sin(S.t*14+g.i)*1.6;
  fc(-6.5,-8,3.6,col);fc(6.5,-8,3.6,col);ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,0,10.5,9.5,0,0,6.3);ctx.fill();
  ctx.beginPath();ctx.ellipse(-5,9+w,3.6,2.4,0,0,6.3);ctx.ellipse(5,9-w,3.6,2.4,0,0,6.3);ctx.fill()}
 if(fr){ctx.strokeStyle='#2a2150';ctx.lineWidth=1.5;ctx.beginPath();
  [-4,4].forEach(x=>{ctx.moveTo(x-2,-4);ctx.lineTo(x+2,0);ctx.moveTo(x+2,-4);ctx.lineTo(x-2,0)});
  ctx.moveTo(-5,5);for(let i=0;i<4;i++)ctx.lineTo(-5+i*3.3+1.6,i%2?5:3.2);ctx.stroke()}
 else{fc(-4,-2,3.4,'#fff');fc(4,-2,3.4,'#fff');fc(-4+v.x*1.6,-2+v.y*1.6,1.8,'#2a2150');fc(4+v.x*1.6,-2+v.y*1.6,1.8,'#2a2150');
  if(!ea){ctx.strokeStyle='#2a2150';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(-5,-6.5);ctx.lineTo(-2,-5.5);ctx.moveTo(5,-6.5);ctx.lineTo(2,-5.5);ctx.stroke()}}
 ctx.restore()}
function draw(){
 const sc=cv.width/(W*TS);ctx.setTransform(sc,0,0,sc,0,0);
 let sx=0,sy=0;if(S.shake>0){sx=(Math.random()-.5)*5;sy=(Math.random()-.5)*5}
 ctx.save();ctx.translate(sx,sy);
 const g0=ctx.createLinearGradient(0,0,0,H*TS);g0.addColorStop(0,'#241a55');g0.addColorStop(1,'#16113a');ctx.fillStyle=g0;ctx.fillRect(-10,-10,W*TS+20,H*TS+20);
 const fl=S.state==='clear'&&Math.floor(S.t*6)%2;ctx.drawImage(fl?wallsF:walls,0,0,W*TS,H*TS);
 for(let j=0;j<H;j++)for(let i=0;i<W;i++){const c=grid[j][i];
  if(c==='.')fc(i*TS+12,j*TS+12,2.6,'#fff0a0');
  else if(c==='o'){const r=5.5+Math.sin(S.t*8)*1.5;fc(i*TS+12,j*TS+12,r+3,'#7fd6ff44');fc(i*TS+12,j*TS+12,r,'#9be3ff');ctx.fillStyle='#fff';ctx.font='9px sans-serif';ctx.textAlign='center';ctx.fillText('★',i*TS+12,j*TS+15)}}
 if(S.fruit){ctx.font='17px serif';ctx.textAlign='center';ctx.globalAlpha=S.fruit.t<2&&Math.floor(S.t*8)%2?.4:1;ctx.fillText(FRUIT[(S.level-1)%6],8*TS+12,9*TS+18+Math.sin(S.t*5)*2);ctx.globalAlpha=1}
 if(S.state!=='menu'&&S.state!=='over'||S.state==='over'){G.forEach(drawGhost);if(S.state!=='over')drawHero()}
 parts.forEach(p=>{const a=p.l/p.m;if(p.ring){ctx.strokeStyle=p.c;ctx.globalAlpha=a;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,(1-a)*140,0,6.3);ctx.stroke()}
  else{ctx.globalAlpha=a;fc(p.x,p.y,p.r*a+.5,p.c)}ctx.globalAlpha=1});
 ctx.font='bold 12px "Trebuchet MS",sans-serif';ctx.textAlign='center';
 pops.forEach(p=>{ctx.globalAlpha=Math.min(1,p.l*2);ctx.lineWidth=3;ctx.strokeStyle='#241a55';ctx.strokeText(p.t,p.x,p.y);ctx.fillStyle=p.c;ctx.fillText(p.t,p.x,p.y)});ctx.globalAlpha=1;
 if(S.power>0){ctx.fillStyle='#7fd6ff';ctx.fillRect(0,0,W*TS*Math.min(1,S.power/S.ft),4)}
 let b=S.state==='ready'?S.banner:S.state==='clear'?'Level clear!':S.state==='over'?'':'';
 if(b){ctx.font='bold 26px "Trebuchet MS",sans-serif';const y=H*TS/2+4+(S.state==='clear'?Math.sin(S.t*8)*3:0);
  ctx.lineWidth=6;ctx.strokeStyle='#241a55';ctx.strokeText(b,W*TS/2,y);ctx.fillStyle=S.state==='clear'?'#ffc928':'#fff3a8';ctx.fillText(b,W*TS/2,y)}
 ctx.restore()}

/* ---------- UI / input ---------- */
function show(t,b,btn){$('ot').textContent=t;$('ob').textContent=b;$('ogo').textContent=btn;$('ov').classList.remove('hide');$('ogo').focus({preventScroll:true})}
function hide(){$('ov').classList.add('hide')}
let paused=false;
function togglePause(){if(S.state!=='play'&&S.state!=='ready')return;paused=!paused;paused?show('Paused','Take a breather. Your dots are safe.','Resume'):hide()}
function act(){initAudio();if(S.state==='menu'||S.state==='over')newGame();else if(paused)togglePause()}
$('ogo').onclick=act;$('pause').onclick=togglePause;
$('mute').onclick=()=>{initAudio();muted=!muted;$('mute').textContent=muted?'🔇':'🔊'};
const KM={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',w:'u',s:'d',a:'l',d:'r',W:'u',S:'d',A:'l',D:'r'};
addEventListener('keydown',e=>{
 if(KM[e.key]){want=KM[e.key];e.preventDefault();initAudio()}
 else if(e.key==='p'||e.key==='P'||e.key==='Escape')togglePause();
 else if(e.key==='m'||e.key==='M')$('mute').click();
 else if((e.key==='Enter'||e.key===' ')&&!$('ov').classList.contains('hide')){e.preventDefault();act()}});
document.querySelectorAll('#pad button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();want=b.dataset.d}));
let sw=null;cv.addEventListener('pointerdown',e=>{sw={x:e.clientX,y:e.clientY};initAudio()});
cv.addEventListener('pointermove',e=>{if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
 if(Math.hypot(dx,dy)>22){want=Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u');sw={x:e.clientX,y:e.clientY}}});
addEventListener('pointerup',()=>sw=null);
addEventListener('blur',()=>{if(S.state==='play'&&!paused)togglePause()});
function resize(){const r=cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2),n=Math.round(r.width*d);if(n&&cv.width!==n){cv.width=cv.height=n}}
new ResizeObserver(resize).observe(cv);

/* ---------- boot ---------- */
grid=RAW.map(r=>r.split(''));S.ng=3;S.ft=7;S.gs=4.8;S.fruit=null;S.power=0;walls=mkWalls(265,false);wallsF=mkWalls(265,true);resetPos();hud();
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;resize();if(!paused)update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
